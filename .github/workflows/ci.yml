name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-features

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, "1.88"]
        exclude:
          # Windows beta can be flaky, focus on stable and MSRV
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.rust }}

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-features

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --all-features
        env:
          # Windows may need longer timeouts for PTY operations
          RUST_TEST_TIME_UNIT: 60000
          RUST_TEST_TIME_INTEGRATION: 120000

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (nightly for rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Lint Windows-only code. The `clippy` job above runs on Linux, where
  # `#[cfg(windows)]` items do not compile and so are never linted — that blind
  # spot let a lint backlog accumulate unnoticed (see #51). Clippy does not link,
  # so the MSVC target can be linted from a Linux runner without a Windows one.
  clippy-windows:
    name: Clippy (Windows target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Add the target to the *active* toolchain, not to `stable`. rust-toolchain.toml
      # pins this repo to 1.92, so cargo runs 1.92 regardless of what the action above
      # installs; passing `targets:` to the action adds the std library to `stable`
      # instead and cargo then fails with `E0463: can't find crate for core`. `rustup
      # target add` honours the pin, so it stays correct if the pin moves.
      - name: Add Windows target to the pinned toolchain
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clippy-windows

      # NOTE: `--all-features` cannot be used here. The `ssh` feature pulls
      # russh -> aws-lc-sys, whose C build requires an MSVC toolchain that a
      # Linux runner does not have. Every other feature cross-lints fine.
      #
      # Consequence: the `#[cfg(windows)]` block in
      # crates/rust-expect/src/backend/ssh/session.rs (Pageant agent support) is
      # NOT covered by this job. Linting it would require a windows-latest
      # runner; that one block was judged not worth the cost.
      - name: Clippy (Windows target, all features except ssh)
        run: |
          cargo clippy --workspace --all-targets \
            --target x86_64-pc-windows-msvc \
            --features "mock,screen,pii-redaction,metrics,legacy-encoding,test-utils" \
            -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: msrv

      - name: Check MSRV
        run: cargo check --workspace --all-features

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "ssh"
          - "mock"
          - "screen"
          - "pii-redaction"
          - "test-utils"
          - "metrics"
          - "full"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: features-${{ matrix.features }}

      - name: Check with features
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check -p rust-expect --no-default-features
          else
            cargo check -p rust-expect --features "${{ matrix.features }}"
          fi

  # Windows-specific feature tests
  windows-features:
    name: Windows Feature Check
    runs-on: windows-latest
    strategy:
      matrix:
        features:
          - ""
          - "ssh"
          - "mock"
          - "screen"
          - "pii-redaction"
          - "metrics"
          - "full"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-features-${{ matrix.features }}

      - name: Check with features
        run: |
          if ("${{ matrix.features }}" -eq "") {
            cargo check -p rust-expect --no-default-features
          } else {
            cargo check -p rust-expect --features "${{ matrix.features }}"
          }
        shell: pwsh
