name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-features

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, "1.88"]
        exclude:
          # Windows beta can be flaky, focus on stable and MSRV
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.rust }}

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-features

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --all-features
        env:
          # Windows may need longer timeouts for PTY operations
          RUST_TEST_TIME_UNIT: 60000
          RUST_TEST_TIME_INTEGRATION: 120000

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (nightly for rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Lint Windows-only code. The `clippy` job above runs on Linux, where
  # `#[cfg(windows)]` items do not compile and so are never linted — that blind
  # spot let a lint backlog accumulate unnoticed (see #51). Clippy does not link,
  # so the MSVC target can be linted from a Linux runner without a Windows one.
  clippy-windows:
    name: Clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clippy-windows

      # The `clippy` job runs on Linux, where `#[cfg(windows)]` items do not compile
      # and so are never linted — that blind spot let a lint backlog accumulate
      # unnoticed (see #51). This job closes it.
      #
      # It runs natively rather than cross-linting the MSVC target from Linux, which
      # is what #51 originally did. Two reasons, and the second is why the switch
      # happened: cross-linting cannot use `--all-features`, because `ssh` -> russh ->
      # aws-lc-sys needs an MSVC C toolchain a Linux runner lacks — so the
      # `#[cfg(windows)]` Pageant block in backend/ssh/session.rs stayed unlinted; and
      # criterion 0.8 pulls `alloca`, whose build script also refuses to
      # cross-compile, which broke the job outright (see #57).
      #
      # Standard GitHub-hosted runners are free on public repositories regardless of
      # OS, so this costs wall-clock only.
      #
      # The closest local pre-push equivalent from a non-Windows host is:
      #
      #   cargo clippy --workspace --lib --target x86_64-pc-windows-msvc \
      #     --features "mock,screen,pii-redaction,metrics,legacy-encoding,test-utils" \
      #     -- -D warnings
      #
      # That covers crates/rust-pty/src/windows/ but NOT the #![cfg(windows)] test
      # files, because `--tests` pulls criterion -> alloca, which will not
      # cross-compile. Lint findings in those test files surface here, not locally.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: msrv

      - name: Check MSRV
        run: cargo check --workspace --all-features

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "ssh"
          - "mock"
          - "screen"
          - "pii-redaction"
          - "test-utils"
          - "metrics"
          - "full"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: features-${{ matrix.features }}

      - name: Check with features
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check -p rust-expect --no-default-features
          else
            cargo check -p rust-expect --features "${{ matrix.features }}"
          fi

  # Windows-specific feature tests
  windows-features:
    name: Windows Feature Check
    runs-on: windows-latest
    strategy:
      matrix:
        features:
          - ""
          - "ssh"
          - "mock"
          - "screen"
          - "pii-redaction"
          - "metrics"
          - "full"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-features-${{ matrix.features }}

      - name: Check with features
        run: |
          if ("${{ matrix.features }}" -eq "") {
            cargo check -p rust-expect --no-default-features
          } else {
            cargo check -p rust-expect --features "${{ matrix.features }}"
          }
        shell: pwsh
