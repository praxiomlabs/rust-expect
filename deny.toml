# cargo-deny configuration for rust-expect
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Target platforms to check
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# The database of advisories to check against
db-path = "~/.cargo/advisory-db"
# Update the advisory database on check
version = 2
# How to handle yanked crates
yanked = "warn"
# Ignore advisories (with reason)
#
# All entries here are transitive dependencies, mostly through the optional
# `ssh` feature (russh). `cargo update` to newer versions of the underlying
# crates is currently blocked because russh-forked-ssh-key 0.6.16 still
# depends on the older `rsa::rand_core::RngCore` shape; pulling in newer
# `rsa` breaks the build. Each entry below is paired with rationale so the
# list can be re-audited when russh updates its dependency tree.
ignore = [
    # Transitive via russh -> rsa. The Marvin Attack requires local timing
    # measurements and is mitigated by network latency for SSH use cases.
    # Tracking: https://github.com/RustCrypto/RSA/issues/19
    { id = "RUSTSEC-2023-0071", reason = "No fix; SSH timing mitigated by network latency" },
    # AWS-LC timing/CRL/PKCS7/X.509 advisories. All transitive through russh's
    # TLS/crypto stack. Fixes exist in newer aws-lc-rs versions but pulling
    # them in requires bumping russh's pinned rsa dep, which breaks
    # internal-russh-forked-ssh-key 0.6.16. Re-evaluate on next russh release.
    { id = "RUSTSEC-2026-0044", reason = "Transitive via russh; awaits russh dep refresh" },
    { id = "RUSTSEC-2026-0045", reason = "Transitive via russh; awaits russh dep refresh" },
    { id = "RUSTSEC-2026-0046", reason = "Transitive via russh; awaits russh dep refresh" },
    { id = "RUSTSEC-2026-0047", reason = "Transitive via russh; awaits russh dep refresh" },
    { id = "RUSTSEC-2026-0048", reason = "Transitive via russh; awaits russh dep refresh" },
    # bytes BytesMut::reserve integer overflow. Direct dep but the buggy
    # path requires constructing buffers near isize::MAX, which the matcher
    # caps at the buffer.max_size config. Bumping bytes to 1.x+ needs to be
    # coordinated with tokio's pinned version.
    { id = "RUSTSEC-2026-0007", reason = "Buffer-overflow path unreachable: matcher caps reserve at buffer.max_size" },
    # cmov non-constant-time on ARM32. Transitive via russh's RSA stack.
    # rust-expect doesn't target ARM32 in CI or release builds; the
    # primary platforms (x86_64/aarch64) are unaffected.
    { id = "RUSTSEC-2026-0003", reason = "Transitive via russh; primary platforms x86_64/aarch64 unaffected" },
    # libcrux-sha3 incremental SHAKE squeeze. Transitive via russh's
    # post-quantum KEM. rust-expect doesn't call the affected API directly;
    # russh's handshake doesn't use the squeeze pattern.
    { id = "RUSTSEC-2026-0074", reason = "Transitive via russh KEM; affected squeeze pattern unreachable" },
    # rand 0.9 unsound when used with a custom logger that calls rand::rng().
    # rust-expect uses rand only for HumanTyper, which never installs a
    # custom logger.
    { id = "RUSTSEC-2026-0097", reason = "Custom-logger interaction path unreachable: HumanTyper does not install loggers" },
]

[licenses]
version = 2
# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
]
# Confidence threshold for license detection
confidence-threshold = 0.8
# Ignore private/unpublished crates (test utilities, workspace members before publish)
private = { ignore = true }

# Clarify licenses that cargo-deny may not detect correctly
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for crates that have been marked as deprecated
wildcards = "allow"
# Allow specific duplicate dependencies
allow = []
# Deny specific crates
deny = [
    # Use thiserror instead (allow as transitive dep from prost-derive)
    { name = "anyhow", wrappers = ["prost-derive"] },
]
# Skip duplicate dependency checks for known transitive conflicts
skip = [
    # crossterm uses signal-hook 0.3, rust-pty uses 0.4
    { crate = "signal-hook@0.3", reason = "crossterm transitive dependency" },
]
skip-tree = [
    # Skip all duplicates from expectrl (dev-dependency benchmarking comparison)
    { crate = "expectrl", reason = "dev-dependency for benchmarks only" },
]

[sources]
# Lint level for crates not from crates.io
unknown-registry = "warn"
# Lint level for crates from git
unknown-git = "warn"
# Allow crates from these registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow crates from these git sources
allow-git = []

[sources.allow-org]
# Allow crates from these GitHub organizations
github = []
